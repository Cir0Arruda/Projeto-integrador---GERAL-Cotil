name: Authenticated native background validation
on:
  workflow_dispatch:
  push:
    branches: ['validation/authenticated-background-*']
    paths:
      - 'apps/mobile/integration_test/authenticated_background_probe_app.dart'
      - 'apps/web/tests/integration/native-background-auth.cjs'
      - 'apps/web/tests/integration/analytics-sandbox.js'
      - 'apps/web/tests/integration/owned-linux-mysql.cjs'
      - '.github/workflows/authenticated-background-validation.yml'
permissions:
  contents: read
concurrency:
  group: authenticated-native-${{ github.sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  android-authenticated-background:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASTHA_ISOLATED_NATIVE_QA: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the reviewed Flutter revision and locked API dependencies
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin 4cf24164269a5ebf0c16a028a00727d0e77bbb05
          git -C "$RUNNER_TEMP/flutter" checkout --detach 4cf24164269a5ebf0c16a028a00727d0e77bbb05
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/astha-auth-android" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$RUNNER_TEMP/astha-auth-android" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/astha-auth-android/avd" >> "$GITHUB_ENV"
          echo "ASTHA_NATIVE_EVIDENCE_DIR=$RUNNER_TEMP/astha-authenticated-native-qa" >> "$GITHUB_ENV"
          npm ci --prefix apps/web/api --ignore-scripts
          mkdir -p "$RUNNER_TEMP/astha-authenticated-native-qa" "$RUNNER_TEMP/astha-auth-android/avd"
          command -v docker
      - name: Verify the separately-owned Linux database and API fixture
        run: node apps/web/tests/integration/native-background-auth.cjs --selftest
      - name: Resolve locked Flutter dependencies and analyze the new probe
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart analyze integration_test/authenticated_background_probe_app.dart
      - name: Create a fresh disposable emulator
        timeout-minutes: 20
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'system-images;android-35;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n ASTHA_AUTH_QA -k 'system-images;android-35;google_apis;x86_64' --path "$ANDROID_AVD_HOME/ASTHA_AUTH_QA.avd" --force
          test -f "$ANDROID_AVD_HOME/ASTHA_AUTH_QA.ini"
          sudo setfacl -m "u:$USER:rw" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd ASTHA_AUTH_QA -port 5554 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 -no-boot-anim > "$RUNNER_TEMP/auth-emulator-private.log" 2>&1 &
          EMULATOR_PID=$!
          for i in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then echo 'Owned emulator exited'; exit 1; fi
            if [ "$(timeout 10 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 5
          done
          test "$(timeout 10 adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
      - name: Verify authenticated stock persistence after the UI process exits
        timeout-minutes: 20
        run: node apps/web/tests/integration/native-background-auth.cjs
      - name: Stop the owned emulator
        if: always()
        run: |
          if adb -s emulator-5554 get-state >/dev/null 2>&1; then adb -s emulator-5554 emu kill; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: authenticated-native-result
          path: ${{ env.ASTHA_NATIVE_EVIDENCE_DIR }}/result.json
          if-no-files-found: ignore
          retention-days: 7
